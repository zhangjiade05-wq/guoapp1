name: 编译真果鉴APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置Go环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: 编译【真果鉴·全站源】ARM64 APK
        run: |
          python3 scripts/build_android.py --all-sources --abi arm64-v8a --cn-mirrors

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: 真果鉴-全站源-arm64.apk
          path: dist/android/zhenguojian-*-arm64-v8a.apk
